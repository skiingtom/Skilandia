name: Windows build

# Builds the Windows installer and portable .exe.
# - Every push to main (or a claude/ branch), and manual runs: download them from the run's "Artifacts".
# - Pushing a tag like v0.3.0: also attaches them to a GitHub Release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playthrough check
        run: npm test

      - name: Build installer + portable exe
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Skilandia-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
