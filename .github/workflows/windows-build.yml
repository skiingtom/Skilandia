name: Windows build

# Builds the Windows installer and portable .exe.
# Paused while the game is being polished: it only runs when started by hand
# (Actions -> Windows build -> Run workflow). Download the results from the
# run's "Artifacts". To build on every push again, add back:
#   push:
#     branches: [main]
#     tags: ["v*"]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playthrough check
        run: npm test

      - name: Build installer + portable exe
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Skilandia-windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
